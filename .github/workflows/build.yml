name: Build

on:
  push:
  pull_request:

jobs:
  version:
    name: Bump patch version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-bump-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.bump.outputs.sha || github.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]'
        with:
          ref: master

      - name: Bump patch and commit
        id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            version=$(bash tools/bump_version.sh)
            git commit -am "Bump version to ${version} [skip ci]"
            if git push origin HEAD:master; then
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Failed to push version bump" >&2
          exit 1

  build:
    name: Build for ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian amd64
            platform: linux/amd64
            deb_arch: amd64
          - name: Raspberry Pi 32-bit
            platform: linux/arm/v7
            deb_arch: armhf
          - name: Raspberry Pi 64-bit
            platform: linux/arm64
            deb_arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Enable cross-architecture emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm,arm64

      - name: Build Debian package
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          docker run --rm \
            --platform "$TARGET_PLATFORM" \
            --env DEB_ARCH \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            debian:bookworm \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                cmake \
                git \
                libexpat1-dev \
                libssl-dev \
                pandoc \
                zlib1g-dev
              cmake -S . -B build \
                -DCMAKE_INSTALL_PREFIX=/ \
                -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE="$DEB_ARCH"
              cmake --build build --parallel "$(nproc)"
              cd build
              cpack -G DEB
            '

      - uses: actions/upload-artifact@v4
        with:
          name: vscpl2drv-socketcan-${{ matrix.deb_arch }}
          path: build/*.deb
          if-no-files-found: error
          retention-days: 3