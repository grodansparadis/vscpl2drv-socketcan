name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian amd64
            platform: linux/amd64
            deb_arch: amd64
          - name: Raspberry Pi 32-bit
            platform: linux/arm/v7
            deb_arch: armhf
          - name: Raspberry Pi 64-bit
            platform: linux/arm64
            deb_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Enable cross-architecture emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm,arm64

      - name: Build Debian package
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          docker run --rm \
            --platform "$TARGET_PLATFORM" \
            --env DEB_ARCH \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            debian:bookworm \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                cmake \
                git \
                libexpat1-dev \
                libssl-dev \
                pandoc \
                zlib1g-dev
              cmake -S . -B build \
                -DCMAKE_INSTALL_PREFIX=/ \
                -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE="$DEB_ARCH"
              cmake --build build --parallel "$(nproc)"
              cd build
              cpack -G DEB
            '

      - uses: actions/upload-artifact@v4
        with:
          name: vscpl2drv-socketcan-${{ matrix.deb_arch }}
          path: build/*.deb
          if-no-files-found: error
          retention-days: 3